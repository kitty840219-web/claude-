能算完的小事。\",\"body\":[\"經營工作室這幾年，我發現插畫接案跟開店最頭痛的，往往不是畫圖，而是後面那一堆數字：這張圖報價多少才划算？平台抽成扣一扣還剩多少利潤？發票要開多少稅額？勞健保又該怎麼算？\",\"所以我做了「艾飛樂會計小幫手」，把這些常常卡住我的問題，整理成一頁就能用的工具站。\",\"裡面有 8 個小幫手：利潤小幫手、成本小幫手、分潤小幫手、發票小幫手、營業稅小幫手、薪資小幫手、勞健保小幫手，還有帶你一步步了解流程的公司設立小幫手。輸入數字，馬上看到結果，不用再拿計算機慢慢按。\",\"首頁還有一個 AI 問答框，遇到不知道怎麼算、或想先了解方向的問題，都可以直接問我；如果是比較複雜的勞資或法規問題，也會幫你指向對應的官方網站（勞動部、勞保局、健保署等），不用自己大海撈針。\",\"所有試算都只是參考，正式金額還是要以帳務資料為準；遇到特殊情況，也建議再找專業會計師確認。但日常那些「先抓個大概」的計算，現在艾飛樂可以幫你一起算了。\"],\"link\":{\"href\":\"/accounting\",\"label\":\"前往會計小幫手 →\"}},{\"id\":\"service-rate-card-launch\",\"title\":\"插畫剪輯設計，2026 服務報價公開了\",\"date\":\"2026-09-10\",\"tag\":\"報價公開\",\"image\":\"/images/pricing-guide-cutout.webp\",\"excerpt\":\"接案價格到底怎麼算？這次把插畫、剪輯、設計的報價全部攤開來給你看，還能線上試算。\",\"body\":[\"常常有人私訊問我：「畫一張語錄圖卡大概多少錢？」「剪一支影片要抓多久？」每次都要重新報價、來回溝通，說真的蠻花時間的，你我都是。\",\"所以這次我把語錄插畫設計、短影音剪輯、平面設計、AI 短影音等服務的價格，整理成一頁「服務報價單」公開給大家看，照 2026 年接案行情定價，報價公開沒有隱藏加購，初稿確認後也提供 2 次免費修改。\",\"最方便的是最上面那個「自動報價試算」——不用等我回覆，自己選需要的項目跟數量，就能馬上看到預估金額，喜歡的話可以直接透過 LINE 把試算結果送出來詢問，省掉來回對報價的時間。\",\"如果你也在想「這個服務大概多少錢」，歡迎直接進去點點看，有任何問題也可以直接跟我聊聊 💬\"],\"link\":{\"href\":\"/pricing\",\"label\":\"查看服務報價 →\"}},{\"id\":\"tarot-service-menu-launch\",\"title\":\"塔羅占卜服務項目更新了，單次到 VIP 包月都有\",\"date\":\"2026-09-10\",\"tag\":\"服務項目\",\"image\":\"/images/tarot-reader-cutout.webp\",\"excerpt\":\"一次占卜、5 個問題，指引方向、看見答案；單次服務跟 VIP 包月方案這次一次整理給你看。\",\"body\":[\"很多人第一次找我占卜，都會問：「我只是想問一個問題，也可以嗎？」「如果想常常來問，有沒有比較划算的方案？」這次把大家常問的整理成一頁服務項目，單次到長期都有對應的選擇。\",\"單次服務的部分：單題占卜 $400／1 個問題；套餐占卜 $1000／5 個問題（限問一主題、不追加）；另外還有比較輕量的字卡訊息、正念卡各 $300，適合想快速抓一個方向、或單純想抽張卡看看現在的自己在想什麼的人。\",\"如果想要比較長期的陪伴，這次也推出 VIP 包月方案：Light VIP（輕療癒）$2999／月，每月可占卜 3 次；Healing VIP（深度療癒）$4999／月，每月 6 次、還有每月運勢分析；Premium VIP（專屬陪伴）$7999／月，每月 9 次、優先回覆、專屬陪伴解析。適合正在經歷感情、工作轉折，需要持續追蹤與陪伴的人。\",\"所有服務預約後 48 小時內回覆，以文字解析為主，忙碌時也會依序回覆，不會漏掉你的提問。想看完整服務內容與價格，歡迎直接進塔羅占卜頁面看看 🔮\"],\"link\":{\"href\":\"/tarot\",\"label\":\"查看塔羅占卜服務 →\"}},{\"id\":\"tarot-testimonials-update\",\"title\":\"31 則真實客戶回饋，是我們前進的動力\",\"date\":\"2026-09-10\",\"tag\":\"客戶回饋\",\"image\":\"/images/tarot-reader-cutout.webp\",\"excerpt\":\"每一則留言都認真看過，也整理成一頁分享給還在猶豫的你，看看其他人怎麼說。\",\"body\":[\"占卜這件事很私人，很多人第一次來之前，都會猶豫：「這真的準嗎？」「花這筆錢值得嗎？」比起我自己說再多，不如讓真的來過的人告訴你。\",\"這次把過去收到的客戶回饋整理成一頁，裡面有 31 則真實留言，很多人分享自己容易內耗、負面情緒一來就想很多，透過占卜把混亂的心情梳理出方向，也有人特別提到回應速度快、建議務實不會太直接冷冰冰，聽完會覺得心情鬆了不少。\",\"也有人提到，之前找過算命老師，講話比較直接、聽完反而壓力更大，花錢買心情差更糟糕；相比之下希望艾飛樂的占卜能給的是陪伴跟具體方向，而不是單純的斷言。\",\"這些留言我都一則一則看過，也是每次接下一張牌前，提醒自己要更用心的原因。如果你也想知道占卜是不是適合現在的你，歡迎進頁面看看其他人的真實回饋，也可以直接到 Google 評論看更完整的內容 💌\"],\"link\":{\"href\":\"/tarot\",\"label\":\"查看客戶真實回饋 →\"}}]}]}]]}]\n11:[\"$\",\"script\",\"script-0\",{\"src\":\"/claude-/_next/static/chunks/2614j-byaq4i0.js\",\"async\":true,\"nonce\":\"$undefined\"}]\n12:[\"$\",\"$L1c\",null,{\"children\":[\"$\",\"$1d\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@1e\"}]}]\n14:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L1f\",null,{\"children\":\"$L20\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L21\",null,{\"children\":[\"$\",\"$1d\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L22\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\n16:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/claude-/_next/static/chunks/3_1wpc5h0-3m3.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n17:[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/claude-/_next/static/chunks/3w1hogg-x9ag6.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n18:[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/claude-/_next/static/chunks/3ecpbbpw3jw2r.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n19:[\"$\",\"link\",\"3\",{\"rel\":\"stylesheet\",\"href\":\"/claude-/_next/static/chunks/0qs1oad6uxkzj.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n13:C\n20:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\
